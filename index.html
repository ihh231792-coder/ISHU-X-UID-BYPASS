<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISHU OXC - UID BYPASS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
--gojo-blue:#3d5afe;--gojo-purple:#7c4dff;--gojo-red:#ff1744;
--gojo-cyan:#00e5ff;--dark:#050510;
}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Rajdhani',sans-serif;background:var(--dark);color:#fff}

/* ============ CANVAS BG ============ */
canvas#gojoCanvas{position:fixed;top:0;left:0;z-index:0;width:100%;height:100%}

/* ============ INFINITY RINGS ============ */
.infinity-ring{
position:fixed;border-radius:50%;border:1px solid;
pointer-events:none;z-index:1;
animation:infinityExpand linear infinite;
}
@keyframes infinityExpand{
0%{transform:scale(0);opacity:0.8}
100%{transform:scale(4);opacity:0}
}

/* ============ SCREEN FLASH ============ */
.screen-flash{
position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;
pointer-events:none;opacity:0;
}
.screen-flash.active{animation:hollowPurple 0.8s ease-out}
@keyframes hollowPurple{
0%{opacity:1;background:radial-gradient(circle at 50% 50%,rgba(124,77,255,0.6),rgba(61,90,254,0.3),transparent 70%)}
40%{opacity:0.8;background:radial-gradient(circle at 50% 50%,rgba(255,23,68,0.4),rgba(124,77,255,0.2),transparent 60%)}
100%{opacity:0}
}

/* ============ SIX EYES GLOW ============ */
.six-eyes-glow{
position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);
width:0;height:0;border-radius:50%;
background:radial-gradient(circle,rgba(61,90,254,0.15),transparent 70%);
pointer-events:none;z-index:1;
animation:none;
}
.six-eyes-glow.active{
animation:eyesOpen 2s ease-out forwards;
}
@keyframes eyesOpen{
0%{width:0;height:0;opacity:0}
30%{width:600px;height:600px;opacity:1}
100%{width:1200px;height:1200px;opacity:0}
}

/* ============ CURSED ENERGY LINES ============ */
.cursed-line{
position:fixed;width:2px;pointer-events:none;z-index:1;
background:linear-gradient(to bottom,transparent,var(--gojo-blue),var(--gojo-purple),transparent);
animation:cursedLine 1.5s ease-out forwards;
opacity:0;
}
@keyframes cursedLine{
0%{opacity:0;transform:scaleY(0);transform-origin:top}
20%{opacity:0.8;transform:scaleY(1)}
100%{opacity:0;transform:scaleY(1)}
}

/* ============ LOGIN BOX ============ */
#loginPage{
position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;
display:flex;align-items:center;justify-content:center;
transition:all 0.8s cubic-bezier(0.16,1,0.3,1);
}
#loginPage.hidden{opacity:0;transform:scale(1.15);filter:blur(10px);pointer-events:none}

.login-box{
width:400px;padding:44px 36px;
background:rgba(8,8,25,0.92);
border:1px solid rgba(61,90,254,0.15);
border-radius:20px;
backdrop-filter:blur(30px);
position:relative;overflow:visible;
animation:gojoAppear 1s cubic-bezier(0.16,1,0.3,1);
}
@keyframes gojoAppear{
0%{opacity:0;transform:translateY(50px) scale(0.9);filter:blur(5px)}
100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}

/* Rotating cursed circle behind box */
.login-box::before{
content:'';position:absolute;top:50%;left:50%;
width:500px;height:500px;transform:translate(-50%,-50%);
border-radius:50%;
border:1px solid rgba(61,90,254,0.08);
animation:cursedCircleRotate 15s linear infinite;
pointer-events:none;
}
@keyframes cursedCircleRotate{to{transform:translate(-50%,-50%) rotate(360deg)}}

.login-box::after{
content:'';position:absolute;top:50%;left:50%;
width:550px;height:550px;transform:translate(-50%,-50%);
border-radius:50%;
border:1px dashed rgba(124,77,255,0.06);
animation:cursedCircleRotate 20s linear infinite reverse;
pointer-events:none;
}

.login-content{position:relative;z-index:2}

/* ============ GOJO EYE LOGO ============ */
.gojo-eye{
width:90px;height:90px;margin:0 auto 20px;
position:relative;cursor:pointer;
}
.gojo-eye .outer-ring{
position:absolute;inset:0;border-radius:50%;
border:2px solid var(--gojo-blue);
animation:eyePulse 3s ease-in-out infinite;
}
.gojo-eye .outer-ring::after{
content:'';position:absolute;inset:-4px;border-radius:50%;
border:1px solid rgba(61,90,254,0.2);
animation:eyePulse 3s ease-in-out infinite 0.5s;
}
@keyframes eyePulse{0%,100%{transform:scale(1);opacity:0.6}50%{transform:scale(1.08);opacity:1}}

.gojo-eye .iris{
position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
width:40px;height:40px;border-radius:50%;
background:radial-gradient(circle at 40% 40%,#7c4dff,#3d5afe,#1a237e);
box-shadow:0 0 30px rgba(61,90,254,0.5),0 0 60px rgba(124,77,255,0.3);
animation:irisGlow 2s ease-in-out infinite;
}
@keyframes irisGlow{
0%,100%{box-shadow:0 0 30px rgba(61,90,254,0.5),0 0 60px rgba(124,77,255,0.3)}
50%{box-shadow:0 0 40px rgba(61,90,254,0.7),0 0 80px rgba(124,77,255,0.4)}
}
.gojo-eye .pupil{
position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
width:16px;height:16px;border-radius:50%;
background:radial-gradient(circle,#fff 30%,rgba(124,77,255,0.8) 60%,transparent 70%);
}
.gojo-eye .pupil::after{
content:'';position:absolute;top:2px;left:6px;
width:5px;height:5px;border-radius:50%;background:#fff;
}
.gojo-eye .star-lines{
position:absolute;inset:0;
}
.gojo-eye .star-lines div{
position:absolute;top:50%;left:50%;width:50%;height:1px;
background:linear-gradient(to right,transparent,rgba(255,255,255,0.3),transparent);
transform-origin:left center;
}
.gojo-eye .star-lines div:nth-child(1){transform:rotate(0deg)}
.gojo-eye .star-lines div:nth-child(2){transform:rotate(45deg)}
.gojo-eye .star-lines div:nth-child(3){transform:rotate(90deg)}
.gojo-eye .star-lines div:nth-child(4){transform:rotate(135deg)}
.gojo-eye .star-lines div:nth-child(5){transform:rotate(180deg)}
.gojo-eye .star-lines div:nth-child(6){transform:rotate(225deg)}
.gojo-eye .star-lines div:nth-child(7){transform:rotate(270deg)}
.gojo-eye .star-lines div:nth-child(8){transform:rotate(315deg)}

.gojo-eye .six-eyes-mark{
position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
font-size:8px;color:var(--gojo-blue);letter-spacing:3px;
font-family:'Orbitron',sans-serif;opacity:0.5;
}

/* ============ TITLE ============ */
.login-title{
text-align:center;font-family:'Orbitron',sans-serif;
font-size:24px;font-weight:900;letter-spacing:4px;
margin-bottom:4px;
background:linear-gradient(135deg,#3d5afe,#7c4dff,#b388ff,#7c4dff,#3d5afe);
background-size:300% 300%;
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
animation:textFlow 4s ease-in-out infinite;
filter:drop-shadow(0 0 20px rgba(61,90,254,0.3));
}
@keyframes textFlow{
0%,100%{background-position:0% 50%}
50%{background-position:100% 50%}
}
.login-subtitle{
text-align:center;font-size:11px;color:rgba(255,255,255,0.2);
letter-spacing:8px;text-transform:uppercase;
}

/* ============ FORM ============ */
.form-group{margin-top:28px;position:relative}
.form-group label{
font-size:10px;color:rgba(255,255,255,0.25);letter-spacing:3px;
text-transform:uppercase;display:block;margin-bottom:8px;
font-family:'Orbitron',sans-serif;
}
.form-group input{
width:100%;padding:13px 18px;
background:rgba(61,90,254,0.04);
border:1px solid rgba(61,90,254,0.12);
border-radius:10px;color:#fff;font-size:16px;
font-family:'Rajdhani',sans-serif;outline:none;
transition:all 0.4s;letter-spacing:1px;
}
.form-group input:focus{
border-color:var(--gojo-blue);
box-shadow:0 0 20px rgba(61,90,254,0.15),inset 0 0 20px rgba(61,90,254,0.05);
background:rgba(61,90,254,0.06);
}
.form-group input::placeholder{color:rgba(255,255,255,0.12)}

/* ============ BUTTON ============ */
.login-btn{
width:100%;margin-top:28px;padding:14px;
background:linear-gradient(135deg,var(--gojo-blue),var(--gojo-purple));
border:none;border-radius:10px;color:#fff;
font-family:'Orbitron',sans-serif;font-size:13px;
font-weight:700;letter-spacing:4px;cursor:pointer;
position:relative;overflow:hidden;transition:all 0.4s;
}
.login-btn::before{
content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
transition:left 0.5s;
}
.login-btn:hover::before{left:100%}
.login-btn:hover{
transform:translateY(-2px);
box-shadow:0 10px 40px rgba(61,90,254,0.4);
}
.login-btn .btn-text{position:relative;z-index:1}
.login-btn .btn-load{
position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);
border-top-color:#fff;border-radius:50%;display:none;
animation:spin 0.5s linear infinite;
}
.login-btn.loading .btn-text{display:none}
.login-btn.loading .btn-load{display:block}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.login-error{
margin-top:14px;padding:12px;text-align:center;
background:rgba(255,23,68,0.08);border:1px solid rgba(255,23,68,0.25);
border-radius:10px;color:#ff4444;font-size:13px;
display:none;animation:shake 0.5s;
}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}60%{transform:translateX(10px)}}

/* ============ BOTTOM LINE ============ */
.login-bottom{
margin-top:20px;text-align:center;
font-size:10px;color:rgba(255,255,255,0.1);
letter-spacing:4px;font-family:'Orbitron',sans-serif;
}

/* ============ DASHBOARD ============ */
#dashPage{
position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;
display:none;align-items:center;justify-content:center;
}
#dashPage.show{display:flex;animation:fadeDashIn 0.8s cubic-bezier(0.16,1,0.3,1)}
@keyframes fadeDashIn{0%{opacity:0;transform:translateY(30px);filter:blur(5px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}

.dash-box{
width:460px;max-height:90vh;padding:36px 32px;
background:rgba(8,8,25,0.92);
border:1px solid rgba(61,90,254,0.12);
border-radius:20px;backdrop-filter:blur(30px);
overflow-y:auto;position:relative;
}
.dash-box::-webkit-scrollbar{width:3px}
.dash-box::-webkit-scrollbar-thumb{background:rgba(61,90,254,0.3);border-radius:4px}
.dash-box::-webkit-scrollbar-track{background:transparent}

.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.dash-header h2{
font-family:'Orbitron',sans-serif;font-size:18px;font-weight:700;
background:linear-gradient(135deg,var(--gojo-blue),var(--gojo-purple));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.logout-btn{
padding:7px 16px;background:rgba(255,23,68,0.08);
border:1px solid rgba(255,23,68,0.25);border-radius:8px;
color:var(--gojo-red);font-size:10px;cursor:pointer;
font-family:'Orbitron',sans-serif;letter-spacing:2px;
transition:all 0.3s;
}
.logout-btn:hover{background:rgba(255,23,68,0.2);box-shadow:0 0 15px rgba(255,23,68,0.2)}

.uid-section{margin-bottom:24px}
.uid-section label{
font-size:10px;color:rgba(255,255,255,0.25);letter-spacing:3px;
text-transform:uppercase;display:block;margin-bottom:8px;
font-family:'Orbitron',sans-serif;
}
.uid-input-row{display:flex;gap:10px}
.uid-input-row input{
flex:1;padding:12px 16px;
background:rgba(61,90,254,0.04);
border:1px solid rgba(61,90,254,0.12);
border-radius:10px;color:#fff;font-size:16px;
font-family:'Rajdhani',sans-serif;outline:none;
transition:all 0.3s;letter-spacing:1px;
}
.uid-input-row input:focus{
border-color:var(--gojo-cyan);
box-shadow:0 0 15px rgba(0,229,255,0.12);
}
.uid-input-row input::placeholder{color:rgba(255,255,255,0.12)}

.authorize-btn{
padding:12px 22px;
background:linear-gradient(135deg,var(--gojo-blue),var(--gojo-purple));
border:none;border-radius:10px;color:#fff;
font-family:'Orbitron',sans-serif;font-size:11px;
font-weight:700;letter-spacing:2px;cursor:pointer;
transition:all 0.3s;white-space:nowrap;
}
.authorize-btn:hover{box-shadow:0 8px 25px rgba(61,90,254,0.35);transform:translateY(-1px)}

.check-btn{
width:100%;margin-top:10px;padding:11px;
background:rgba(0,229,255,0.05);
border:1px solid rgba(0,229,255,0.15);
border-radius:10px;color:var(--gojo-cyan);
font-family:'Orbitron',sans-serif;font-size:10px;
letter-spacing:3px;cursor:pointer;transition:all 0.3s;
}
.check-btn:hover{background:rgba(0,229,255,0.12)}

.uid-result{
margin-top:12px;padding:11px 16px;border-radius:10px;
font-size:13px;display:none;animation:fadeIn 0.3s;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.uid-result.ok{display:block;background:rgba(0,255,0,0.05);border:1px solid rgba(0,255,0,0.2);color:#00ff88}
.uid-result.fail{display:block;background:rgba(255,23,68,0.05);border:1px solid rgba(255,23,68,0.2);color:#ff4444}
.uid-result.info{display:block;background:rgba(0,229,255,0.05);border:1px solid rgba(0,229,255,0.2);color:var(--gojo-cyan)}

.uid-list{margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.04)}
.uid-list h3{font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;font-family:'Orbitron',sans-serif}

.uid-item{
display:flex;align-items:center;justify-content:space-between;
padding:10px 14px;margin-bottom:8px;
background:rgba(61,90,254,0.03);
border:1px solid rgba(61,90,254,0.08);
border-radius:8px;font-size:15px;animation:fadeIn 0.3s;
transition:all 0.3s;
}
.uid-item:hover{border-color:rgba(61,90,254,0.2);background:rgba(61,90,254,0.06)}
.uid-item span{color:var(--gojo-cyan);font-weight:600;letter-spacing:1px}
.uid-item .del-btn{
padding:5px 12px;background:rgba(255,23,68,0.08);
border:1px solid rgba(255,23,68,0.2);border-radius:6px;
color:var(--gojo-red);font-size:10px;cursor:pointer;
transition:all 0.3s;font-family:'Orbitron',sans-serif;letter-spacing:1px;
}
.uid-item .del-btn:hover{background:rgba(255,23,68,0.25)}

/* ============ FLOATING CURSED SIGILS ============ */
.curse-sigil{
position:fixed;pointer-events:none;z-index:1;
font-size:20px;color:rgba(61,90,254,0.15);
animation:sigilFloat linear infinite;
}
@keyframes sigilFloat{
0%{opacity:0;transform:translateY(100vh) rotate(0deg)}
10%{opacity:0.4}
90%{opacity:0.2}
100%{opacity:0;transform:translateY(-50px) rotate(360deg)}
}

/* ============ RESPONSIVE ============ */
@media(max-width:480px){
.login-box,.dash-box{width:92%;padding:30px 24px}
}
</style>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,get,set,push,remove,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyDummyKeyForPublic",
databaseURL:"https://uidbypassaxcaman-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"uidbypassaxcaman",
storageBucket:"uidbypassaxcaman.appspot.com",
messagingSenderId:"000000000000",
appId:"1:000000000000:web:000000000000000000"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const VALID_USER="SIBU";
const VALID_PASS="ISHU1212";

window.doLogin=function(){
const user=document.getElementById('loginUser').value.trim();
const pass=document.getElementById('loginPass').value;
const errDiv=document.getElementById('loginError');
const btn=document.getElementById('loginBtn');

if(!user||!pass){errDiv.textContent='Enter credentials';errDiv.style.display='block';return}

btn.classList.add('loading');

setTimeout(()=>{
if(user===VALID_USER&&pass===VALID_PASS){
triggerSixEyes();
setTimeout(()=>{
flashScreen();
spawnInfinityRings();
spawnCursedLines();

document.getElementById('loginPage').classList.add('hidden');

loadUIDList();
},500);
},400);
},300);
}else{
errDiv.textContent='Wrong credentials â€” Infinity rejected you';
errDiv.style.display='block';
errDiv.style.animation='none';errDiv.offsetHeight;errDiv.style.animation='shake 0.5s';
}
btn.classList.remove('loading');
},700);
};

window.doLogout=function(){
document.getElementById('dashPage').classList.remove('show');
document.getElementById('dashPage').style.display='none';
document.getElementById('loginPage').classList.remove('hidden');
document.getElementById('loginUser').value='';
document.getElementById('loginPass').value='';
document.getElementById('loginError').style.display='none';
setTimeout(()=>{document.getElementById('dashPage').style.display=''},100);
};

function triggerSixEyes(){
const el=document.getElementById('sixEyes');
el.classList.remove('active');el.offsetHeight;el.classList.add('active');
setTimeout(()=>el.classList.remove('active'),2500);
}

function flashScreen(){
const el=document.getElementById('screenFlash');
el.classList.remove('active');el.offsetHeight;el.classList.add('active');
}

function spawnInfinityRings(){
for(let i=0;i<5;i++){
setTimeout(()=>{
const ring=document.createElement('div');
ring.className='infinity-ring';
ring.style.left='50%';ring.style.top='50%';
ring.style.width='100px';ring.style.height='100px';
ring.style.marginLeft='-50px';ring.style.marginTop='-50px';
ring.style.borderColor=i%2===0?'rgba(61,90,254,0.3)':'rgba(124,77,255,0.2)';
ring.style.animationDuration=(2+i*0.5)+'s';
document.body.appendChild(ring);
setTimeout(()=>ring.remove(),4000);
},i*200);
}
}

function spawnCursedLines(){
for(let i=0;i<8;i++){
setTimeout(()=>{
const line=document.createElement('div');
line.className='cursed-line';
line.style.left=Math.random()*100+'vw';
line.style.top='0';
line.style.height=(100+Math.random()*200)+'px';
line.style.animationDelay=(Math.random()*0.3)+'s';
document.body.appendChild(line);
setTimeout(()=>line.remove(),2000);
},i*100);
}
}

// UID MANAGEMENT
window.authorizeUID=async function(){
const input=document.getElementById('uidInput');
const resultDiv=document.getElementById('uidResult');
const uid=input.value.trim();
if(!uid||!/^\d{5,15}$/.test(uid)){resultDiv.className='uid-result fail';resultDiv.textContent='Enter valid UID (5-15 digits)';return}
try{
const snap=await get(ref(db,'users'));
let exists=false;
if(snap.exists()){
const d=snap.val();
outer:for(const k in d){const u=d[k].uids;if(Array.isArray(u)){for(const i of u){const eu=typeof i==='object'?i.uid:i;if(String(eu)===uid){exists=true;break outer}}}}
}
if(exists){resultDiv.className='uid-result info';resultDiv.textContent='UID '+uid+' already authorized!'}
else{const ne=push(ref(db,'users'));await set(ne,{uids:[{uid:uid,added:Date.now()}]});resultDiv.className='uid-result ok';resultDiv.textContent='UID '+uid+' authorized!';input.value='';loadUIDList()}
}catch(e){resultDiv.className='uid-result fail';resultDiv.textContent='Error: '+e.message}
};

window.checkUIDStatus=async function(){
const uid=document.getElementById('uidInput').value.trim();
const rd=document.getElementById('uidResult');
if(!uid||!/^\d{5,15}$/.test(uid)){rd.className='uid-result fail';rd.textContent='Enter a UID first';return}
rd.className='uid-result info';rd.textContent='Checking...';
try{
const snap=await get(ref(db,'users'));let found=false;
if(snap.exists()){const d=snap.val();outer2:for(const k in d){const u=d[k].uids;if(Array.isArray(u)){for(const i of u){const eu=typeof i==='object'?i.uid:i;if(String(eu)===uid){found=true;break outer2}}}}}
rd.className=found?'uid-result ok':'uid-result fail';
rd.textContent=found?uid+' is AUTHORIZED':uid+' is NOT authorized';
}catch(e){rd.className='uid-result fail';rd.textContent='Error: '+e.message}
};

window.deleteUID=async function(uid,key){
if(!confirm('Remove UID '+uid+'?'))return;
try{await remove(ref(db,'users/'+key));document.getElementById('uidResult').className='uid-result ok';document.getElementById('uidResult').textContent='UID '+uid+' removed';loadUIDList()}catch(e){}
};

function loadUIDList(){
const c=document.getElementById('uidListContainer');
onValue(ref(db,'users'),(snap)=>{
c.innerHTML='';
if(!snap.exists()){c.innerHTML='<div style="color:rgba(255,255,255,0.1);font-size:13px;text-align:center;padding:20px">No UIDs yet</div>';return}
const d=snap.val();
for(const k in d){const u=d[k].uids;if(Array.isArray(u)){for(const i of u){
const uv=typeof i==='object'?i.uid:i;
const div=document.createElement('div');div.className='uid-item';
div.innerHTML='<span>'+uv+'</span><button class="del-btn" onclick="deleteUID(\''+uv+'\',\''+k+'\')">REMOVE</button>';
c.appendChild(div);
}}}
});
}

document.getElementById('uidInput').addEventListener('keypress',e=>{if(e.key==='Enter')authorizeUID()});
document.getElementById('loginPass').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('loginUser').addEventListener('keypress',e=>{if(e.key==='Enter')document.getElementById('loginPass').focus()});
</script>

<!-- ========== GOJO CANVAS ANIMATION ========== -->
<script>
const C=document.getElementById('gojoCanvas');
const X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

// Particles
const P=[];
for(let i=0;i<100;i++){
P.push({
x:Math.random()*2000,y:Math.random()*2000,
vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,
r:Math.random()*2+0.5,
type:Math.random()>0.7?'purple':'blue',
pulse:Math.random()*Math.PI*2
});
}

// Energy streams
const streams=[];
function spawnStream(){
streams.push({
x:Math.random()*W,y:H+20,
speed:1+Math.random()*2,
length:50+Math.random()*100,
alpha:0.1+Math.random()*0.2,
color:Math.random()>0.5?'61,90,254':'124,77,255'
});
}

function drawGojo(){
X.fillStyle='rgba(5,5,16,0.15)';
X.fillRect(0,0,W,H);

const time=Date.now()*0.001;

// Draw energy streams (like cursed energy rising)
if(Math.random()<0.03)spawnStream();
for(let i=streams.length-1;i>=0;i--){
const s=streams[i];
s.y-=s.speed;
const grad=X.createLinearGradient(s.x,s.y,s.x,s.y+s.length);
grad.addColorStop(0,'rgba('+s.color+',0)');
grad.addColorStop(0.5,'rgba('+s.color+','+s.alpha+')');
grad.addColorStop(1,'rgba('+s.color+',0)');
X.strokeStyle=grad;
X.lineWidth=1.5;
X.beginPath();
X.moveTo(s.x+Math.sin(s.y*0.02)*10,s.y);
X.lineTo(s.x+Math.sin((s.y+s.length)*0.02)*10,s.y+s.length);
X.stroke();
if(s.y<-s.length)streams.splice(i,1);
}

// Draw particles
for(let i=0;i<P.length;i++){
const p=P[i];
p.x+=p.vx;p.y+=p.vy;p.pulse+=0.02;
if(p.x<0)p.x=W;if(p.x>W)p.x=0;
if(p.y<0)p.y=H;if(p.y>H)p.y=0;

const glow=0.3+Math.sin(p.pulse)*0.2;
if(p.type==='blue'){
X.fillStyle='rgba(61,90,254,'+glow+')';
X.shadowColor='rgba(61,90,254,0.4)';
}else{
X.fillStyle='rgba(124,77,255,'+glow+')';
X.shadowColor='rgba(124,77,255,0.4)';
}
X.shadowBlur=10;
X.beginPath();
X.arc(p.x,p.y,p.r,0,Math.PI*2);
X.fill();

// Connections
for(let j=i+1;j<P.length;j++){
const p2=P[j];
const dx=p.x-p2.x,dy=p.y-p2.y;
const dist=Math.sqrt(dx*dx+dy*dy);
if(dist<100){
const a=0.04*(1-dist/100);
X.strokeStyle='rgba(61,90,254,'+a+')';
X.shadowBlur=0;
X.lineWidth=0.5;
X.beginPath();
X.moveTo(p.x,p.y);
X.lineTo(p2.x,p2.y);
X.stroke();
}
}
}
X.shadowBlur=0;

// Central energy orb (faint)
const orbX=W/2+Math.sin(time*0.5)*50;
const orbY=H/3+Math.cos(time*0.3)*30;
const orbGrad=X.createRadialGradient(orbX,orbY,0,orbX,orbY,150);
orbGrad.addColorStop(0,'rgba(61,90,254,0.04)');
orbGrad.addColorStop(0.5,'rgba(124,77,255,0.02)');
orbGrad.addColorStop(1,'rgba(0,0,0,0)');
X.fillStyle=orbGrad;
X.fillRect(orbX-150,orbY-150,300,300);

requestAnimationFrame(drawGojo);
}
drawGojo();

const sigils=['å‘ª','è¡“','å»»','æˆ¦','é ˜','åŸŸ','å±•','é–‹','ç„¡','ä¸‹','é™','å…­','çœ¼'];
